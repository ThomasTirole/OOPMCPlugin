name: oopmc
version: '${version}'

main: ch.tirtho.oopmc.OOPMCPlugin
api-version: '26.3'
load: POSTWORLD

commands:
  heal:
    description: Soigne le joueur
    usage: /heal
    permission: oopmc.heal

  testinv:
    description: Remplit l'inventaire pour les tests
    usage: /ch.tirtho.oopmc.testinv

permissions:
  oopmc.heal:
    description: Autorise /heal
    default: op
